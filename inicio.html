<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storks - Menú Principal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Atma:wght@400;700&family=Barrio&family=BIZ+UDGothic:wght@400;700&family=Croissant+One&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="scss/miestilo.css" rel="stylesheet">
</head>
<body class="home-body">


    <header class="navbar-storks container-fluid py-2 px-4 d-flex justify-content-between align-items-center">

        <div class="d-flex align-items-center brand-container p-2">
            <span class="brand-text me-2">storks</span>
            <img src="img/ciguena_ne.png" alt="Logo Storks" class="header-logo">
        </div>

        <div class="d-flex align-items-center flex-grow-1 mx-4" style="max-width: 500px;">
            <div class="input-group">
                <input type="text" class="form-control custom-input" placeholder="...">
                <button class="btn btn-orange-dark" type="button">
                    <i class="bi bi-search"></i>
                </button>
            </div>
        </div>


        <div class="d-flex align-items-center gap-3">
            <button class="btn btn-icon" type="button" title="Carrito">
                <i class="bi bi-cart3 fs-4"></i>
            </button>
            <button class="btn btn-icon" type="button" title="Ver / Accesibilidad">
                <i class="bi bi-eye fs-4"></i>
            </button>
            <button class="btn btn-icon rounded-circle profile-btn" type="button" title="Perfil">
                <i class="bi bi-person-fill fs-4"></i>
            </button>
        </div>
    </header>


    <main class="container py-4">
        
        <h1 class="text-center main-title mb-4">Menú principal</h1>

        <section class="mb-5">
            
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3 class="section-title mb-0">Novedades</h3>
                <a href="#" class="ver-mas-link">Ver más...</a>
            </div>
           
            <div class="row g-3">
                <div class="col-6 col-md-4 col-lg-2"><div class="product-card"></div></div>
                <div class="col-6 col-md-4 col-lg-2"><div class="product-card"></div></div>
                <div class="col-6 col-md-4 col-lg-2"><div class="product-card"></div></div>
                <div class="col-6 col-md-4 col-lg-2"><div class="product-card"></div></div>
                <div class="col-6 col-md-4 col-lg-2"><div class="product-card"></div></div>
                <div class="col-6 col-md-4 col-lg-2"><div class="product-card"></div></div>
            </div>
            
            <div class="row g-3 mt-1">
                <div class="col-6 col-md-4 col-lg-2"><div class="product-card"></div></div>
                <div class="col-6 col-md-4 col-lg-2"><div class="product-card"></div></div>
                <div class="col-6 col-md-4 col-lg-2"><div class="product-card"></div></div>
                <div class="col-6 col-md-4 col-lg-2"><div class="product-card"></div></div>
                <div class="col-6 col-md-4 col-lg-2"><div class="product-card"></div></div>
                <div class="col-6 col-md-4 col-lg-2"><div class="product-card"></div></div>
            </div>
        </section>

        
        <section class="mb-4">
            
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3 class="section-title mb-0">Recomendados</h3>
                <a href="#" class="ver-mas-link">Ver más...</a>
            </div>
            
            <div class="row g-3">
                <div class="col-6 col-md-4 col-lg-2"><div class="product-card"></div></div>
                <div class="col-6 col-md-4 col-lg-2"><div class="product-card"></div></div>
                <div class="col-6 col-md-4 col-lg-2"><div class="product-card"></div></div>
                <div class="col-6 col-md-4 col-lg-2"><div class="product-card"></div></div>
                <div class="col-6 col-md-4 col-lg-2"><div class="product-card"></div></div>
                <div class="col-6 col-md-4 col-lg-2"><div class="product-card"></div></div>
            </div>
            
            <div class="row g-3 mt-1">
                <div class="col-6 col-md-4 col-lg-2"><div class="product-card"></div></div>
                <div class="col-6 col-md-4 col-lg-2"><div class="product-card"></div></div>
                <div class="col-6 col-md-4 col-lg-2"><div class="product-card"></div></div>
                <div class="col-6 col-md-4 col-lg-2"><div class="product-card"></div></div>
                <div class="col-6 col-md-4 col-lg-2"><div class="product-card"></div></div>
                <div class="col-6 col-md-4 col-lg-2"><div class="product-card"></div></div>
            </div>
        </section>

    </main>

</body>
</html>
